name: Self Check & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pytest
        run: |
          pytest -v

      - name: Run Resource Leak Guard action on fixtures
        uses: ./.github/actions/resource-leak-guard
        with:
          path: "tests/fixtures/java/01_no_leak_explicit_close.java"
          fail-on: "definite"
